<div class="operator">
  <div class="card">
    <h1>Experimento de Ressurgência</h1>
    <p class="subtitle">Configuração da sessão (operador)</p>

    <form (ngSubmit)="start()">
      <label>
        ID do participante *
        <input type="text" name="externalId" [(ngModel)]="externalId"
               placeholder="ex.: P001" autocomplete="off" required />
      </label>

      <div class="row">
        <label>
          Idade
          <input type="number" name="age" [(ngModel)]="age" min="0" max="120" />
        </label>
        <label>
          Sexo
          <select name="sex" [(ngModel)]="sex">
            <option value="">—</option>
            <option value="F">Feminino</option>
            <option value="M">Masculino</option>
            <option value="O">Outro</option>
          </select>
        </label>
      </div>

      <label>
        Grupo
        <select name="group" [(ngModel)]="group">
          <option *ngFor="let opt of groupOptions" [value]="opt.value">{{ opt.label }}</option>
        </select>
      </label>

      <label class="checkbox">
        <input type="checkbox" name="devMode" [(ngModel)]="devMode" />
        Modo dev (fases curtas de 30 s para teste)
      </label>

      <p class="error" *ngIf="errorMsg">{{ errorMsg }}</p>

      <button type="submit" [disabled]="!externalId.trim() || submitting">
        {{ submitting ? 'Iniciando…' : 'Iniciar sessão' }}
      </button>
    </form>

    <p class="hint">
      A tarefa abre em tela cheia. Não há sinalização entre as fases.
    </p>
  </div>
</div>
